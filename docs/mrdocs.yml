# MrDocs configuration for the Open3SDCM C++ API.
#
# Pattern: "scanned". MrDocs walks the `input` directories, synthesizes a
# compilation database from the public headers and parses each as its own
# translation unit. No prior CMake/vcpkg build is required to generate the
# reference; the header search paths below resolve the public-API dependencies
# (Poco, Boost, OpenSSL) so libclang can parse ParseDcm.h / definitions.h.
#
# Run from the repository root:
#   mrdocs --config=docs/mrdocs.yml
#
# The generated HTML is written to docs-build/html by default. See
# .github/workflows/docs.yml for the CI build that publishes it.

# Everything in the config is resolved relative to the repository root.
source-root: ..

# Public headers that form the Open3SDCM C++ API surface.
input:
  - ../Lib/src

# Header search paths. The library's own src/ is declared PUBLIC in
# Lib/CMakeLists.txt and must be on the path so ParseDcm.h can find
# definitions.h. The transitive public dependencies (Poco::XML, Boost,
# OpenSSL) are installed via the matching -dev packages (libpoco-dev,
# libboost-all-dev, libssl-dev on Debian/Ubuntu); the system include
# directories must be listed explicitly because MrDocs' "scanned" mode
# synthesizes a compilation database without the compiler's default
# system search paths.
#
# For a local build against a vcpkg-installed tree instead of system packages,
# replace the /usr/include entries below with the vcpkg include directory, e.g.:
#   - ../builds/ninja-release-vcpkg/vcpkg_installed/x64-linux/include
includes:
  - ../Lib/src
  - /usr/include
  - /usr/include/x86_64-linux-gnu

# Only document the public namespace. The detail namespace and CLI/python
# translation units are implementation and stay out of the reference.
include-symbols:
  - 'Open3SDCM::**'
implementation-defined:
  - '**::detail'

# Emit a multi-page HTML site under docs-build/html.
generator: html
multipage: true

# Fail loudly on unresolved symbols so the docs job surfaces parsing problems
# instead of silently dropping members from the reference.
verbose: true
