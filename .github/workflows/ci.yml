name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/BenchmarkResults/**'
      - '**/FunctionTests/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            compiler: GCC
            cc: gcc
            cxx: g++
            linux_packages: ninja-build g++
          - name: Linux / Clang
            os: ubuntu-latest
            compiler: Clang
            cc: clang
            cxx: clang++
            linux_packages: ninja-build clang
          - name: macOS
            os: macos-latest
            compiler: AppleClang
          - name: Windows
            os: windows-latest
            compiler: MSVC

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linux_packages }}

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: Chocobo1/setup-ccache-action@v1.4.3

      - name: Setup sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.7

      - uses: lukka/get-cmake@latest

      - name: Restore or setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: ${{ runner.os == 'Linux' && '1' || '' }}
          VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'Windows' && 'x64-windows' || '' }}
          SCCACHE_GHA_ENABLED: ${{ runner.os == 'Windows' && 'true' || '' }}

      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        uses: lukka/run-cmake@v10.7
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: ninja-release-vcpkg-tests
          buildPreset: ninja-release-vcpkg-tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          VCPKG_FORCE_SYSTEM_BINARIES: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Configure and build (macOS / Windows)
        if: runner.os != 'Linux'
        uses: lukka/run-cmake@v10.7
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: ninja-release-vcpkg-tests
          buildPreset: ninja-release-vcpkg-tests
        env:
          SCCACHE_GHA_ENABLED: ${{ runner.os == 'Windows' && 'true' || '' }}

      - name: Run tests
        run: ctest --preset ninja-release-vcpkg-tests --output-on-failure

      # The bindings reuse the vcpkg tree and the CLI this job already built,
      # so installing and testing them here costs a compile of the extension
      # rather than a fresh dependency build. Windows is covered by the wheels
      # workflow instead: this job builds Poco/OpenSSL as DLLs, and Python 3.8+
      # resolves extension dependencies via os.add_dll_directory rather than
      # PATH, whereas the wheels build links them statically (x64-windows-static-md).
      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python bindings
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installed=$(find builds/ninja-release-vcpkg-tests/vcpkg_installed \
                        -mindepth 1 -maxdepth 1 -type d ! -name vcpkg | head -1)
          if [ -z "${installed}" ]; then
            echo "::error::could not locate the vcpkg installed tree"
            exit 1
          fi
          echo "Using vcpkg tree: ${installed}"
          export CMAKE_ARGS="-DCMAKE_PREFIX_PATH=${PWD}/${installed} -DOPENSSL_ROOT_DIR=${PWD}/${installed}"
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Verify the installed package imports and converts
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -c "
          import open3sdcm
          print('open3sdcm', open3sdcm.__version__)
          v, f, c = open3sdcm.load(r'${{ github.workspace }}/TestData/Handle/HandleAngledLarge.dcm')
          print('vertices', v.shape, v.dtype, '| faces', f.shape, f.dtype, '| color', c)
          assert v.shape == (3776, 3) and f.shape == (7548, 3) and c == (128, 101, 108)
          "

      - name: Test Python bindings
        if: runner.os != 'Windows'
        shell: bash
        run: python -m pytest python/tests -q

  sanitizers:
    name: Sanitizers / Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy cppcheck

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1.4.3

      - uses: lukka/get-cmake@latest

      - name: Restore or setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Configure and build with sanitizers
        uses: lukka/run-cmake@v10.7
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: ninja-sanitizers-vcpkg
          buildPreset: ninja-sanitizers-vcpkg
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Run tests
        run: ctest --preset ninja-sanitizers-vcpkg --output-on-failure
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
